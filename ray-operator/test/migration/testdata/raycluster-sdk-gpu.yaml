# RayCluster generated by codeflare-sdk with GPU configuration
# 
# Created with: ClusterConfiguration(
#     name="sdk-gpu",
#     namespace="test-migration",
#     head_extended_resource_requests={"nvidia.com/gpu": 1},
#     worker_extended_resource_requests={"nvidia.com/gpu": 2},
#     num_workers=2
# )
#
# All GPU-related config should be PRESERVED after migration
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster-sdk-gpu
  namespace: test-migration
  labels:
    controller-tools.k8s.io: "1.0"
spec:
  rayVersion: '2.47.1'
  enableInTreeAutoscaling: false
  autoscalerOptions:
    upscalingMode: Default
    idleTimeoutSeconds: 60
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 500m
        memory: 512Mi
  headGroupSpec:
    serviceType: ClusterIP
    enableIngress: false
    rayStartParams:
      dashboard-host: '0.0.0.0'
      block: 'true'
      num-gpus: '1'
      resources: '"{\"GPU\": 1}"'
    template:
      spec:
        containers:
        - name: ray-head
          image: quay.io/modh/ray@sha256:6d076aeb38ab3c34a6a2ef0f58dc667089aa15826fa08a73273c629333e12f1e
          imagePullPolicy: Always
          ports:
          - containerPort: 6379
            name: gcs
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/sh
                - -c
                - ray stop
          resources:
            limits:
              cpu: 2
              memory: 8G
              nvidia.com/gpu: 1
            requests:
              cpu: 1
              memory: 5G
              nvidia.com/gpu: 1
          volumeMounts:
          - mountPath: /etc/pki/tls/certs/odh-trusted-ca-bundle.crt
            name: odh-trusted-ca-cert
            subPath: odh-trusted-ca-bundle.crt
          - mountPath: /etc/ssl/certs/odh-trusted-ca-bundle.crt
            name: odh-trusted-ca-cert
            subPath: odh-trusted-ca-bundle.crt
          - mountPath: /etc/pki/tls/certs/odh-ca-bundle.crt
            name: odh-ca-cert
            subPath: odh-ca-bundle.crt
          - mountPath: /etc/ssl/certs/odh-ca-bundle.crt
            name: odh-ca-cert
            subPath: odh-ca-bundle.crt
        volumes:
        - name: odh-trusted-ca-cert
          configMap:
            name: odh-trusted-ca-bundle
            items:
            - key: ca-bundle.crt
              path: odh-trusted-ca-bundle.crt
            optional: true
        - name: odh-ca-cert
          configMap:
            name: odh-trusted-ca-bundle
            items:
            - key: odh-ca-bundle.crt
              path: odh-ca-bundle.crt
            optional: true
  workerGroupSpecs:
  - replicas: 2
    minReplicas: 2
    maxReplicas: 2
    groupName: small-group-raycluster-sdk-gpu
    rayStartParams:
      block: 'true'
      num-gpus: '2'
      resources: '"{\"GPU\": 2}"'
    template:
      spec:
        containers:
        - name: machine-learning
          image: quay.io/modh/ray@sha256:6d076aeb38ab3c34a6a2ef0f58dc667089aa15826fa08a73273c629333e12f1e
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/sh
                - -c
                - ray stop
          resources:
            limits:
              cpu: 1
              memory: 6G
              nvidia.com/gpu: 2
            requests:
              cpu: 1
              memory: 3G
              nvidia.com/gpu: 2
          volumeMounts:
          - mountPath: /etc/pki/tls/certs/odh-trusted-ca-bundle.crt
            name: odh-trusted-ca-cert
            subPath: odh-trusted-ca-bundle.crt
          - mountPath: /etc/ssl/certs/odh-trusted-ca-bundle.crt
            name: odh-trusted-ca-cert
            subPath: odh-trusted-ca-bundle.crt
          - mountPath: /etc/pki/tls/certs/odh-ca-bundle.crt
            name: odh-ca-cert
            subPath: odh-ca-bundle.crt
          - mountPath: /etc/ssl/certs/odh-ca-bundle.crt
            name: odh-ca-cert
            subPath: odh-ca-bundle.crt
        volumes:
        - name: odh-trusted-ca-cert
          configMap:
            name: odh-trusted-ca-bundle
            items:
            - key: ca-bundle.crt
              path: odh-trusted-ca-bundle.crt
            optional: true
        - name: odh-ca-cert
          configMap:
            name: odh-trusted-ca-bundle
            items:
            - key: odh-ca-bundle.crt
              path: odh-ca-bundle.crt
            optional: true
