# RayCluster with custom ServiceAccountName that should be PRESERVED after migration
# The migration should only clear ServiceAccountName if it matches CodeFlare pattern (*-oauth-proxy*)
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster-custom-serviceaccount
  namespace: test-migration
spec:
  rayVersion: '2.46.0'
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
    template:
      spec:
        serviceAccountName: my-custom-ray-service-account  # SHOULD BE PRESERVED
        containers:
        - name: ray-head
          image: rayproject/ray:2.46.0
          ports:
          - containerPort: 6379
            name: gcs
          - containerPort: 8265
            name: dashboard
          resources:
            limits:
              cpu: "1"
              memory: "2G"
            requests:
              cpu: "500m"
              memory: "2G"
  workerGroupSpecs:
  - replicas: 1
    minReplicas: 1
    maxReplicas: 5
    groupName: worker-group
    rayStartParams: {}
    template:
      spec:
        serviceAccountName: my-worker-service-account  # SHOULD BE PRESERVED
        containers:
        - name: ray-worker
          image: rayproject/ray:2.46.0
          resources:
            limits:
              cpu: "1"
              memory: "1G"
            requests:
              cpu: "500m"
              memory: "1G"
