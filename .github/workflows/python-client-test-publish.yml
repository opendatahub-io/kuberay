name: Publish Python Client to TestPyPI

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'clients/odh-kuberay-client/**'
      - '.github/workflows/odh-kuberay-client-test-publish.yml'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry and Twine
      run: |
        python -m pip install --upgrade pip
        pip install poetry twine

    - name: Generate unique version for PR
      working-directory: clients/odh-kuberay-client
      id: version
      run: |
        DEV_VERSION="0.0.0.dev${{ github.run_number }}"
        echo "VERSION=$DEV_VERSION" >> $GITHUB_OUTPUT
        poetry version $DEV_VERSION

    - name: Build and Check package
      working-directory: clients/odh-kuberay-client
      run: |
        poetry build
        twine check dist/*

    - name: Publish to TestPyPI
      working-directory: clients/odh-kuberay-client
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --repository testpypi dist/* --verbose

    - name: Update PR Description
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const version = '${{ steps.version.outputs.VERSION }}' || `0.0.0.dev${{ github.event.pull_request.number }}`;
          const runId = '${{ github.run_id }}';
          const serverUrl = '${{ github.server_url }}';
          const repo = '${{ github.repository }}';
          const success = '${{ job.status }}' === 'success';

          const section = success
            ? `## 📦 TestPyPI Package\n\n✅ **Python client published to TestPyPI!**\n\nVersion: \`${version}\`\n\nInstall with:\n\n\`\`\`bash\npip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ odh-kuberay-client==${version}\`\`\`\n\n`
            : `## 📦 TestPyPI Package\n\n❌ **Failed to publish Python client to TestPyPI**\n\nSee [workflow logs](${serverUrl}/${repo}/actions/runs/${runId}) for details.\n\n---\n`;

          const { data: pullRequest } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          const body = pullRequest.body || '';
          const regex = /## 📦 TestPyPI Package[\s\S]*?---\n*/g;
          const newBody = regex.test(body)
            ? body.replace(regex, section + '\n\n')
            : body + '\n\n' + section;
          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            body: newBody
          });
