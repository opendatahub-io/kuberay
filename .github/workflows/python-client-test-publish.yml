name: Publish Python Client to TestPyPI

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'clients/odh-kuberay-client/**'
      - '.github/workflows/odh-kuberay-client-test-publish.yml'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry and Twine
      run: |
        python -m pip install --upgrade pip
        pip install poetry twine

    - name: Set unique version and build
      working-directory: clients/odh-kuberay-client
      run: |
        DEV_VERSION="0.0.0.dev${{ github.event.pull_request.number }}"
        poetry version $DEV_VERSION
        poetry build

    - name: Check package
      working-directory: clients/odh-kuberay-client
      run: |
        twine check dist/*

    - name: Publish to TestPyPI
      working-directory: clients/odh-kuberay-client
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --repository testpypi dist/* --verbose


    - name: Update PR Description
      uses: actions/github-script@v7
      if: success()
      with:
        script: |
          const version = '${{ steps.version.outputs.VERSION }}';

          const { data: pullRequest } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });

          const currentBody = pullRequest.body || '';

          const testPyPISection = [
            '## 📦 TestPyPI Package',
            '',
            '✅ **Python client published to TestPyPI!**',
            '',
            `Version: \`${version}\``,
            '',
            'Install with:',
            '```bash',
            `pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ odh-kuberay-client==${version}`,
            '```',
            '',
            `View package: https://test.pypi.org/project/odh-kuberay-client/${version}/`,
            '',
          ].join('\n');

          const testPyPIRegex = /## 📦 TestPyPI Package[\s\S]*?(?=##|---\n|$)/;
          let newBody;

          if (testPyPIRegex.test(currentBody)) {
            newBody = currentBody.replace(testPyPIRegex, testPyPISection + '\n\n');
          } else {
            newBody = currentBody + '\n\n' + testPyPISection;
          }

          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            body: newBody
          });

    - name: Update PR Description (failure)
      uses: actions/github-script@v7
      if: failure()
      with:
        script: |
          const { data: pullRequest } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });

          const currentBody = pullRequest.body || '';

          const testPyPISection = [
            '## 📦 TestPyPI Package',
            '',
            '❌ **Failed to publish Python client to TestPyPI**',
            '',
            `Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`,
            '',
            'Common issues:',
            '- Missing or invalid TEST_PYPI_API_TOKEN secret',
            '- Version already exists on TestPyPI',
            '- Package metadata issues',
            '',
          ].join('\n');

          const testPyPIRegex = /## 📦 TestPyPI Package[\s\S]*?(?=##|---\n|$)/;
          let newBody;

          if (testPyPIRegex.test(currentBody)) {
            newBody = currentBody.replace(testPyPIRegex, testPyPISection + '\n\n');
          } else {
            newBody = currentBody + '\n\n' + testPyPISection;
          }

          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            body: newBody
          });
